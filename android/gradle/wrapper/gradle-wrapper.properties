# File Purpose: Pins the reproducible Gradle distribution used by Cube Android.
# Primary Components: Distribution URL, cache locations, validation, and timeout.
# Inputs/Outputs: Read by gradlew; downloads or reuses Gradle 8.14.5.

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
