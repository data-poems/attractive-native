name: Attractive
options:
  bundleIdPrefix: com.lukesteuber
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Single source of truth for version + build across the app and its widget
    # (Apple requires the embedded extension's build to match the app). ASC
    # already has 1.0 builds up to 9, so the next upload is build 10.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"

packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.0"

targets:

  Attractive:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftMath
      - target: AttractiveWidgets
    sources:
      - path: Attractive
      - path: AttractiveCore
        excludes:
          - "Package.swift"
          - "Tests"
          - ".build"
    info:
      path: Attractive/Info.plist
      properties:
        CFBundleDisplayName: Attractive
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.attractive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  # Home Screen widget: a configurable strange-attractor still. Compiles the
  # AttractiveCore sources directly (same as the app — no separate framework),
  # so the engine's pure render path backs the widget. No SwiftMath (that's only
  # the app's LaTeX); no App Group (the attractor is chosen in the widget editor).
  AttractiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AttractiveWidgets
      - path: AttractiveCore
        excludes:
          - "Package.swift"
          - "Tests"
          - ".build"
    info:
      path: AttractiveWidgets/Info.plist
      properties:
        CFBundleDisplayName: Attractive
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.attractive.widgets
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
